<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converse Code</title>
<style>
:root{color-scheme:dark;--bg:#11120f;--panel:#1b1d19;--text:#eee9df;--muted:#979d92;--line:#343832;--accent:#ed765f;--ok:#9abb9e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header,main,footer{width:min(760px,calc(100% - 2rem));margin:auto}header{display:flex;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
h1{font-size:1rem;margin:0}.badge{margin-left:auto;color:var(--ok);font:12px ui-monospace,monospace}main{padding:1rem 0;overflow:auto}.empty{color:var(--muted);text-align:center;margin-top:20vh}
.entry{max-width:85%;padding:.7rem .85rem;margin:.6rem 0;border:1px solid var(--line);border-radius:.7rem;background:var(--panel)}.user{margin-left:auto}.assistant{margin-right:auto}.notice{max-width:100%;color:var(--muted);background:transparent;text-align:center;border:0}
footer{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;padding:1rem 0}input,button{font:inherit;border:1px solid var(--line);border-radius:.55rem;padding:.7rem;background:var(--panel);color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:#1a0c08;border-color:var(--accent);font-weight:700}button:disabled,input:disabled{opacity:.55}
</style>
</head>
<body>
<header><h1>Converse Code</h1><span id="status" class="badge">connecting</span></header>
<main id="log"><p id="empty" class="empty">A minimal background-tool reference powered by Pi and Codex.</p></main>
<footer>
  <input id="text" aria-label="Message" placeholder="Ask Codex to work on this project">
  <button id="send">Send</button>
  <button id="voice" class="primary" aria-pressed="false">Start voice</button>
</footer>
<script type="module">
const token=new URLSearchParams(location.search).get("t")||"";
const log=document.querySelector("#log"),empty=document.querySelector("#empty");
const input=document.querySelector("#text"),send=document.querySelector("#send");
const voice=document.querySelector("#voice"),status=document.querySelector("#status");
let client=null,opening=null,mic=false,ready=false,seqs=new Map(),assistantRow=null;

function row(kind,text){empty?.remove();const el=document.createElement("div");el.className=`entry ${kind}`;el.textContent=text;log.append(el);log.scrollTop=log.scrollHeight;return el}
function wireSend(frame){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(frame))}
const ws=new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
ws.onopen=()=>{status.textContent="idle"};
ws.onmessage=event=>{const frame=JSON.parse(event.data);if(frame.event==="bridge_control"){seqs.set(frame.seq,frame);flush()}};

async function openClient(){
  if(client)return client;if(opening)return opening;
  opening=(async()=>{
    const sdk=await import("./vendor/converse/index.js");
    const sessionId=sdk.createSessionId();
    const response=await fetch(`/session-credential?t=${encodeURIComponent(token)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});
    if(!response.ok)throw new Error(`credential request failed: ${response.status}`);
    const credential=await response.json();
    const instance=new sdk.ConverseClient({url:credential.ws_url,apiKey:credential.api_key,sessionId:credential.session_id,mode:{kind:"converse",voice:"classic",web_search:false,tools:credential.tools||[]}});
    instance.addEventListener("event",event=>render(event.detail||{}));
    await instance.unlockAudio();await instance.connect({noGreeting:true});
    client=instance;ready=true;wireSend({type:"local",event:"bridge_ready"});await flush();return instance;
  })();
  try{return await opening}finally{opening=null}
}

function render(event){
  if(event.type==="asr"&&event.final)row("user",event.text||"");
  if(event.type==="turn")assistantRow=row("assistant","");
  if(event.type==="text_delta"){
    assistantRow=assistantRow||row("assistant","");
    assistantRow.textContent+=(event.delta||"");
  }
  if(event.type==="utterance"){
    assistantRow=assistantRow||row("assistant","");
    assistantRow.textContent=event.text||event.utterance||"";
  }
  if(event.type==="done"||event.type==="interrupted")assistantRow=null;
  if(event.type==="tool_call")wireSend({type:"local",event:"tool_call",call:event});
  if(event.type==="tool_cancel")wireSend({type:"local",event:"tool_cancel",call:event});
  if(event.type==="reconnecting")ready=false;
  if(event.type==="reconnected"){ready=true;wireSend({type:"local",event:"bridge_ready"});flush()}
}

async function flush(){
  if(!ready||!client)return;
  for(const [seq,frame]of [...seqs]){
    let accepted=true;
    if(frame.action==="tool_deferred")accepted=client.sendToolDeferred(frame.id,{handle:frame.handle,statusLabel:frame.status_label});
    else if(frame.action==="tool_progress")accepted=client.sendToolProgress(frame.id,frame.note);
    else if(frame.action==="tool_partial_result")accepted=client.sendToolPartialResult(frame.id,frame.content,{reply:!!frame.reply});
    else if(frame.action==="tool_result")accepted=client.sendToolResult(frame.id,frame.content,{outcome:frame.outcome,verified:!!frame.verified});
    else if(frame.action==="tool_cancel")accepted=client.sendToolCancel(frame.id);
    else{seqs.delete(seq);continue}
    if(accepted!==true){ready=false;break}
    if(frame.action==="tool_deferred")status.textContent="working";
    if(frame.action==="tool_result")status.textContent="idle";
    seqs.delete(seq);wireSend({type:"local",event:"bridge_ack",seq});
  }
}

async function submit(){
  const text=input.value.trim();if(!text)return;input.disabled=send.disabled=true;
  try{const active=await openClient();const id=crypto.randomUUID();const ack=await active.sendText(text,{messageId:id});if(!ack?.accepted)throw new Error(ack?.reason||"message rejected");input.value=""}
  catch(error){row("notice",`Could not send: ${error.message||error}`)}finally{input.disabled=send.disabled=false;input.focus()}
}
send.onclick=submit;input.onkeydown=event=>{if(event.key==="Enter")submit()};
voice.onclick=async()=>{const active=await openClient();if(mic){active.stopMic();mic=false;voice.textContent="Start voice"}else{await active.startMic({workletUrl:"./vendor/converse/mic-worklet.js"});mic=true;voice.textContent="Stop voice"}voice.setAttribute("aria-pressed",String(mic))};
</script>
</body>
</html>
