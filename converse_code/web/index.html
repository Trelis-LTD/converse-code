<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converse Code</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --text:#1c1e21; --muted:#6b7280;
    --border:#e2e4e8; --accent:#3b6fe0; --accent-fg:#ffffff;
    --danger:#d0403b; --you:#1c1e21; --asst:#245c3b; --inject:#8a5a00;
    --dot-connecting:#d9a400; --dot-open:#2e9e4f; --dot-closed:#c0392b;
    --chip-idle:#3b6fe0; --chip-working:#d9a400; --chip-menu:#7a4fd1;
    --meter-bg:#e6e8eb; --meter-fill:#3b6fe0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --panel:#1e2126; --text:#e7e9ec; --muted:#9aa1ab;
      --border:#2c3038; --accent:#5a8dff; --accent-fg:#0b0d10;
      --danger:#ef5f5a; --you:#e7e9ec; --asst:#6fd39a; --inject:#f0c15a;
      --dot-connecting:#e0b23a; --dot-open:#4bcf78; --dot-closed:#e0625c;
      --chip-idle:#5a8dff; --chip-working:#e0b23a; --chip-menu:#a988f0;
      --meter-bg:#2a2d33; --meter-fill:#5a8dff;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:.6rem;
    padding:.75rem 1rem; border-bottom:1px solid var(--border);
    background:var(--panel); flex:0 0 auto;
  }
  header h1{font-size:1.05rem; margin:0; font-weight:650; letter-spacing:.01em;}
  .dot{width:.6rem; height:.6rem; border-radius:50%; flex:0 0 auto; background:var(--dot-closed); transition:background .2s;}
  .dot.connecting{background:var(--dot-connecting);}
  .dot.open{background:var(--dot-open);}
  .dot.closed{background:var(--dot-closed);}
  .spacer{flex:1;}
  .chip{
    font-size:.75rem; padding:.25rem .6rem; border-radius:999px;
    background:var(--chip-idle); color:#fff; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  }
  .chip.working{background:var(--chip-working); color:#1c1e21;}
  .chip.menu{background:var(--chip-menu);}
  .chip.idle{background:var(--chip-idle);}
  main{
    flex:1 1 auto; overflow:hidden; display:flex; flex-direction:column;
    max-width:760px; width:100%; margin:0 auto; padding:0 1rem;
  }
  #log{
    flex:1 1 auto; overflow-y:auto; padding:1rem 0; display:flex; flex-direction:column; gap:.5rem;
  }
  .entry{max-width:88%; padding:.5rem .75rem; border-radius:.6rem; line-height:1.4; font-size:.92rem; word-wrap:break-word;}
  .entry.you{align-self:flex-end; background:var(--accent); color:var(--accent-fg);}
  .entry.assistant{align-self:flex-start; background:var(--panel); border:1px solid var(--border); color:var(--asst);}
  .entry.inject{
    align-self:center; background:transparent; border:1px dashed var(--border);
    color:var(--inject); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem;
  }
  .entry.banner{align-self:center; background:transparent; color:var(--muted); font-size:.8rem; font-style:italic;}
  .entry .label{display:block; font-size:.68rem; opacity:.65; margin-bottom:.15rem; text-transform:uppercase; letter-spacing:.04em;}
  footer{
    flex:0 0 auto; padding:1rem; border-top:1px solid var(--border); background:var(--panel);
    display:flex; align-items:center; gap:1rem; max-width:760px; width:100%; margin:0 auto;
  }
  #micBtn{
    flex:0 0 auto; width:3.4rem; height:3.4rem; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-fg); font-size:1.4rem; display:flex; align-items:center; justify-content:center;
    transition:transform .1s, background .2s; box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  #micBtn:active{transform:scale(.94);}
  #micBtn.live{background:var(--danger);}
  #meterWrap{flex:1 1 auto; height:.5rem; border-radius:999px; background:var(--meter-bg); overflow:hidden;}
  #meterFill{height:100%; width:0%; background:var(--meter-fill); transition:width .06s linear;}
  #micLabel{font-size:.78rem; color:var(--muted); flex:0 0 auto; min-width:3.2rem; text-align:right;}
</style>
</head>
<body>
<header>
  <span class="dot closed" id="wsDot" title="WebSocket status"></span>
  <h1>Converse Code</h1>
  <div class="spacer"></div>
  <span class="chip idle" id="statusChip">idle</span>
</header>
<main>
  <div id="log"></div>
</main>
<footer>
  <button id="micBtn" title="Toggle microphone">&#127908;</button>
  <div id="meterWrap"><div id="meterFill"></div></div>
  <span id="micLabel">off</span>
</footer>
<script>
(function(){
  "use strict";

  var BUILD = "2026-08-06-sdk-0.5.0";

  // ---------- WebSocket connection with auto-reconnect ----------
  var ws = null;
  var wsDot = document.getElementById("wsDot");
  var statusChip = document.getElementById("statusChip");
  var reconnectDelay = 2000;
  var reconnectTimer = null;

  function wsUrl(){
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    // The run's token arrives in this page's own URL; the server requires it
    // on the socket too, so other pages can't open one.
    var token = new URLSearchParams(location.search).get("t") || "";
    return proto + "//" + location.host + "/ws?t=" + encodeURIComponent(token);
  }

  function setDot(state){
    wsDot.className = "dot " + state;
  }

  function connect(){
    setDot("connecting");
    try{
      ws = new WebSocket(wsUrl());
    }catch(e){
      scheduleReconnect();
      return;
    }
    ws.binaryType = "arraybuffer";
    ws.onopen = function(){
      setDot("open");
    };
    ws.onclose = function(){
      setDot("closed");
      scheduleReconnect();
    };
    ws.onerror = function(){
      try{ ws.close(); }catch(e){}
    };
    ws.onmessage = function(ev){
      if(typeof ev.data === "string"){
        handleJson(ev.data);
      } else {
        handleAudioFrame(ev.data);
      }
    };
  }

  function scheduleReconnect(){
    if(reconnectTimer) return;
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
  }

  function sendJson(obj){
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify(obj));
    }
  }

  // ---------- Conversation log ----------
  var logEl = document.getElementById("log");
  var userScrolledUp = false;

  logEl.addEventListener("scroll", function(){
    var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 24;
    userScrolledUp = !atBottom;
  });

  function autoScroll(){
    if(!userScrolledUp){
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  var currentYouEl = null;
  var currentAssistantEl = null;
  var assistantText = "";  // accumulates text_delta chunks for the live caption

  function makeEntry(kind, labelText){
    var div = document.createElement("div");
    div.className = "entry " + kind;
    if(labelText){
      var label = document.createElement("span");
      label.className = "label";
      label.textContent = labelText;
      div.appendChild(label);
    }
    var body = document.createElement("span");
    body.className = "body";
    div.appendChild(body);
    logEl.appendChild(div);
    autoScroll();
    return div;
  }

  function setBody(entryEl, text){
    var body = entryEl.querySelector(".body");
    body.textContent = text;
    autoScroll();
  }

  function freezeYou(){
    currentYouEl = null;
  }
  function freezeAssistant(){
    currentAssistantEl = null;
  }

  function addInjected(text){
    var el = makeEntry("inject", "→ sent to Claude Code");
    setBody(el, text);
  }

  function addBanner(text){
    makeEntry("banner", null).querySelector(".body").textContent = text;
    autoScroll();
  }

  // ---------- Local + passthrough JSON handling ----------
  function pickText(msg){
    if(typeof msg.text === "string") return msg.text;
    if(typeof msg.transcript === "string") return msg.transcript;
    if(typeof msg.partial === "string") return msg.partial;
    if(typeof msg.utterance === "string") return msg.utterance;
    if(typeof msg.content === "string") return msg.content;
    return "";
  }

  function isFinal(msg){
    var f = msg.final !== undefined ? msg.final : msg.is_final;
    if(f === undefined) return false;
    return !!f;
  }

  function handleJson(raw){
    var msg;
    try{
      msg = JSON.parse(raw);
    }catch(e){
      console.debug("bad json frame", raw);
      return;
    }

    if(msg.type === "local"){
      if(msg.event === "status"){
        updateStatusChip(msg.state, msg.queue);
      } else if(msg.event === "injected"){
        addInjected(msg.text || "");
      }
      return;
    }

    switch(msg.type){
      case "asr": {
        var text = pickText(msg);
        if(!currentYouEl){
          currentYouEl = makeEntry("you", "You");
        }
        setBody(currentYouEl, text);
        if(isFinal(msg)){
          freezeYou();
        }
        break;
      }
      case "turn": {
        // Carries the full reply text already, but text_delta streams it word by
        // word — start empty and let the deltas fill in, so captions animate.
        freezeYou();
        currentAssistantEl = makeEntry("assistant", "Assistant");
        assistantText = "";
        break;
      }
      case "text_delta": {
        if(!currentAssistantEl){
          currentAssistantEl = makeEntry("assistant", "Assistant");
          assistantText = "";
        }
        assistantText += (msg.delta || "");
        setBody(currentAssistantEl, assistantText);
        break;
      }
      case "utterance": {
        // Authoritative final text — replaces whatever the deltas assembled.
        var atext = pickText(msg);
        if(!currentAssistantEl){
          currentAssistantEl = makeEntry("assistant", "Assistant");
        }
        assistantText = atext;
        setBody(currentAssistantEl, atext);
        break;
      }
      case "done": {
        freezeAssistant();
        freezeYou();
        break;
      }
      case "interrupted": {
        handleInterrupted(msg);
        break;
      }
      case "bye": {
        addBanner("Session ended" + (msg.reason ? (": " + msg.reason) : ""));
        break;
      }
      default:
        console.debug("ignored message type", msg.type, msg);
    }
  }

  function updateStatusChip(state, queue){
    state = state || "idle";
    statusChip.className = "chip " + state;
    var label = state;
    if(Array.isArray(queue) && queue.length > 0){
      label += " (" + queue.length + ")";
    }
    statusChip.textContent = label;
  }

  // ---------- Audio: the official @trelis/converse SDK ----------
  // Microphone capture, echo cancellation, streaming playback and interruption
  // handling all come from the SDK (vendored under web/vendor/converse). This
  // replaced a hand-rolled implementation whose defects were, in order: decoding
  // PCM16 downlink audio as Float32 (pure noise), no jitter buffer, and clicks at
  // every chunk seam. The SDK is the same audio path the Converse playground
  // runs, so this page is no longer the place those bugs can live.
  //
  // The session itself is still owned by the converse-code process — one socket
  // carries both audio and the tool protocol — so only the SDK's audio pieces
  // are used here, not its ConverseClient.
  var micBtn = document.getElementById("micBtn");
  var micLabel = document.getElementById("micLabel");
  var meterFill = document.getElementById("meterFill");

  var sdk = null;          // loaded module namespace
  var player = null;       // StreamingPlayer
  var mic = null;          // MicCapture
  var micActive = false;

  function loadSdk(){
    if(sdk) return Promise.resolve(sdk);
    // index.js exposes StreamingPlayer/MicCapture/floatToPcm16Bytes; the frame
    // decoder lives in audio.js and is not re-exported, so take it from there.
    return Promise.all([
      import("./vendor/converse/index.js"),
      import("./vendor/converse/audio.js")
    ]).then(function(mods){
      sdk = Object.assign({}, mods[0], {binaryToFloat32: mods[1].binaryToFloat32});
      return sdk;
    });
  }

  function getPlayer(){
    if(!player && sdk) player = new sdk.StreamingPlayer();
    return player;
  }

  // Browsers hold AudioContext.resume() until the page has been interacted with,
  // so assistant audio is silent until then. Clicking the mic counts, but someone
  // who only types in the terminal and listens would get nothing and no reason
  // why — so any click unlocks audio, and a banner says so if audio arrives first.
  var audioUnlocked = false;
  var audioBannerShown = false;

  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    loadSdk().then(function(){
      var p = getPlayer();
      if(p && p.ensureContext) return p.ensureContext();
    }).catch(function(err){ console.debug("audio unlock failed", err); });
  }

  document.addEventListener("click", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function handleAudioFrame(arrayBuffer){
    if(!arrayBuffer || arrayBuffer.byteLength < 2) return;
    if(!audioUnlocked && !audioBannerShown){
      audioBannerShown = true;
      addBanner("Click anywhere on this page to enable audio playback.");
    }
    loadSdk().then(function(mod){
      // binaryToFloat32 decodes the wire format (PCM16) — the SDK owns that
      // definition, so this page can't get it wrong again.
      return mod.binaryToFloat32(arrayBuffer);
    }).then(function(samples){
      var p = getPlayer();
      if(p) return p.enqueue(samples);
    }).catch(function(err){
      console.debug("audio frame dropped", err);
    });
  }

  function handleInterrupted(msg){
    // The broker decides a barge happened; the page only stops local playback and
    // reports how much audio it threw away, which the broker uses to truncate
    // what it believes was heard.
    var discarded = 0;
    if(player){
      discarded = Math.round(player.pendingMs ? player.pendingMs() : 0);
      try{ player.clear(); }catch(e){}
    }
    sendJson({
      type: "playback_stopped",
      remaining_ms: discarded,
      discarded_ms: discarded,
      barge_seq: (msg && msg.barge_seq !== undefined) ? msg.barge_seq : 0
    });
    freezeAssistant();
  }

  function setMeter(level){
    meterFill.style.width = Math.min(100, Math.round(level * 100)) + "%";
  }

  function frameLevel(frame){
    var peak = 0;
    for(var i = 0; i < frame.length; i++){
      var v = frame[i] < 0 ? -frame[i] : frame[i];
      if(v > peak) peak = v;
    }
    return peak;
  }

  function startMic(){
    if(micActive) return;
    micLabel.textContent = "…";
    loadSdk().then(function(mod){
      var p = getPlayer();
      // A user gesture is required before audio may play; the mic click is it.
      if(p && p.ensureContext) return p.ensureContext().then(function(){ return mod; });
      return mod;
    }).then(function(mod){
      mic = new mod.MicCapture({
        workletUrl: "./vendor/converse/mic-worklet.js",
        onFrame: function(frame){
          if(ws && ws.readyState === WebSocket.OPEN){
            ws.send(mod.floatToPcm16Bytes(frame));
          }
          setMeter(frameLevel(frame));
        }
      });
      return mic.start();
    }).then(function(){
      micActive = true;
      micBtn.classList.add("live");
      micLabel.textContent = "live";
    }).catch(function(err){
      console.debug("mic error", err);
      micLabel.textContent = "off";
      addBanner("Microphone unavailable: " + (err && err.message ? err.message : err));
    });
  }

  function stopMic(){
    if(!micActive) return;
    micActive = false;
    micBtn.classList.remove("live");
    micLabel.textContent = "off";
    setMeter(0);
    try{ if(mic) mic.stop(); }catch(e){}
    mic = null;
  }

  micBtn.addEventListener("click", function(){
    if(micActive){ stopMic(); } else { startMic(); }
  });

  // ---------- Boot ----------
  // Printed so it is always possible to tell which page a browser has loaded —
  // a cached page previously looked identical to a fixed one.
  console.info("converse-code voice tab | audio: @trelis/converse SDK 0.5.0 | build " + BUILD);
  connect();
})();
</script>
</body>
</html>
