<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converse Code</title>
<style>
:root{color-scheme:dark;--bg:#11120f;--panel:#1b1d19;--text:#eee9df;--muted:#979d92;--line:#343832;--accent:#ed765f;--ok:#9abb9e;--user-bg:#35221e;--user-line:#78483f;--assistant-bg:#192622;--assistant-line:#426158}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
header,main,footer{width:min(760px,calc(100% - 2rem));margin:0 auto}header{display:flex;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
h1{font-size:1rem;margin:0}.badge{margin-left:auto;color:var(--ok);font:12px ui-monospace,monospace}main{height:100%;min-height:0;padding:1rem 0;overflow:auto}.empty{color:var(--muted);text-align:center;margin-top:20vh}
.entry{max-width:85%;padding:.7rem .85rem;margin:.6rem 0;border:1px solid var(--line);border-radius:.7rem;background:var(--panel);white-space:pre-wrap}.entry::before{content:attr(data-label);display:block;margin-bottom:.3rem;color:var(--muted);font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.user{margin-left:auto;background:var(--user-bg);border-color:var(--user-line)}.user::before{color:#f49a87}.assistant{margin-right:auto;background:var(--assistant-bg);border-color:var(--assistant-line)}.assistant::before{color:#a9cfb7}.activity{max-width:100%;padding:.55rem .7rem;color:var(--muted);background:transparent;text-align:left;border-style:dashed;font:13px/1.45 ui-monospace,monospace}.activity::before{display:inline;margin-right:.7rem;color:#c1b9a8}
footer{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1rem 0}.hint,#notice{color:var(--muted);margin:0}button{font:inherit;border:1px solid var(--accent);border-radius:.65rem;padding:.8rem 1.2rem;background:var(--accent);color:#1a0c08;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
</style>
</head>
<body>
<header><h1>Converse Code</h1><span id="status" class="badge">connecting</span></header>
<main id="log"><p id="empty" class="empty">Speak to drive the visible Pi terminal.</p></main>
<footer>
  <p class="hint">Live speech, replies, and coding activity</p>
  <button id="voice" aria-pressed="false">Start voice</button>
  <p id="notice" role="status"></p>
</footer>
<script type="module">
const token=new URLSearchParams(location.search).get("t")||"";
const log=document.querySelector("#log"),empty=document.querySelector("#empty");
const voice=document.querySelector("#voice"),status=document.querySelector("#status"),notice=document.querySelector("#notice");
let client=null,opening=null,mic=false,ready=false,flushing=false,seqs=new Map();
const userRows=new Map(),assistantRows=new Map(),renderedControls=new Set();
const deferredIds=new Set();
const activeReplies=new Set(),replyWaiters=[];
const instructions=`You are the voice router for Converse Code's visible Pi terminal, not the coding agent. You have no direct knowledge of the user's computer, current directory, repository, files, code, git state, or commands. For every question or request that depends on that host state, your first action must be coding_task; never answer it yourself, ask permission to pass it, or offer to pass it later. Always preserve the user's complete technical wording in the tool request. Call coding_task immediately with no spoken preamble. After it is accepted, do not narrate your own intent; say at most that Pi is working and do not repeatedly promise updates. While a coding task is active, pass corrections, additions, and answers through continue_task. When told that an approval is waiting, ask the user for allow once, allow for this session, or block. After their explicit choice, call approval_decision immediately with the supplied approval_id and no spoken preamble. After approval succeeds, say only that Pi is continuing; do not answer the original request until coding_task returns. Never infer approval. Treat tool partials and results as the only evidence of Pi's progress or completion. Keep spoken acknowledgements brief.`;

const labels={user:"You",assistant:"Converse Code",activity:"Activity"};
function followBottom(){log.scrollTop=log.scrollHeight}
function row(kind,text,label=labels[kind]){empty?.remove();const el=document.createElement("div");el.className=`entry ${kind}`;el.dataset.label=label;el.setAttribute("aria-label",label);el.textContent=text;log.append(el);followBottom();return el}
function activity(text,label="Activity"){if(text)row("activity",text,label)}
function waitForReplyIdle(){
  if(!activeReplies.size)return Promise.resolve();
  return new Promise(resolve=>{
    const waiter=()=>{clearTimeout(timer);resolve()};
    const timer=setTimeout(()=>{const index=replyWaiters.indexOf(waiter);if(index>=0)replyWaiters.splice(index,1);resolve()},10000);
    replyWaiters.push(waiter);
  });
}
function releaseReplyWaiters(){if(activeReplies.size)return;for(const resolve of replyWaiters.splice(0))resolve()}
async function deliverVoicePrompt(frame){
  for(let attempt=0;attempt<3;attempt++){
    await waitForReplyIdle();
    const ack=await client.injectContext(frame.text,{role:"context",reply:true,messageId:`converse-approval-${frame.prompt_id}`});
    if(ack?.accepted===true)return true;
    if(ack?.retryable!==true)return false;
  }
  return false;
}

function wireSend(frame){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(frame))}
const ws=new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
ws.onopen=()=>{status.textContent="idle"};
ws.onmessage=event=>{const frame=JSON.parse(event.data);if(frame.event==="bridge_control"){seqs.set(frame.seq,frame);flush()}};

async function openClient(){
  if(client)return client;if(opening)return opening;
  opening=(async()=>{
    const sdk=await import("./vendor/converse/index.js");
    const sessionId=sdk.createSessionId();
    const response=await fetch(`/session-credential?t=${encodeURIComponent(token)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});
    if(!response.ok)throw new Error(`credential request failed: ${response.status}`);
    const credential=await response.json();
    const instance=new sdk.ConverseClient({url:credential.ws_url,apiKey:credential.api_key,sessionId:credential.session_id,mode:{kind:"converse",voice:"classic",instructions,web_search:false,tools:credential.tools||[]}});
    instance.addEventListener("event",event=>handleEvent(event.detail||{}));
    await instance.unlockAudio();await instance.connect({noGreeting:true});
    client=instance;ready=true;wireSend({type:"local",event:"bridge_ready"});await flush();return instance;
  })();
  try{return await opening}finally{opening=null}
}

function handleEvent(event){
  const turnId=event.turn_id||event.message_id||"current";
  if(event.type==="asr"){
    const current=userRows.get(turnId)||row("user","");current.textContent=event.text||"";
    userRows.set(turnId,current);if(event.final)userRows.delete(turnId);followBottom();
  }
  if(event.type==="turn"){activeReplies.add(turnId);if(!assistantRows.has(turnId))assistantRows.set(turnId,row("assistant",""))}
  if(event.type==="text_delta"){
    const current=assistantRows.get(turnId)||row("assistant","");
    current.textContent+=event.delta||"";assistantRows.set(turnId,current);followBottom();
  }
  if(event.type==="utterance"){
    const current=assistantRows.get(turnId)||row("assistant","");
    current.textContent=event.text||event.utterance||"";assistantRows.set(turnId,current);followBottom();
  }
  if(event.type==="done"||event.type==="interrupted"||event.type==="canceled"){activeReplies.delete(turnId);releaseReplyWaiters()}
  if(event.type==="tool_call")activity(`Requested ${event.name||"tool"}`,"Voice tool");
  if(event.type==="tool_call")wireSend({type:"local",event:"tool_call",call:event});
  if(event.type==="tool_cancel")wireSend({type:"local",event:"tool_cancel",call:event});
  if(event.type==="reconnecting")ready=false;
  if(event.type==="reconnected"){ready=true;wireSend({type:"local",event:"bridge_ready"});flush()}
  if(event.type==="error")notice.textContent=event.detail||event.code||"Voice connection failed";
}

function renderControl(frame){
  if(renderedControls.has(frame.seq))return;renderedControls.add(frame.seq);
  if(frame.action==="tool_deferred")activity(`${frame.status_label||"Task"} accepted in the background`,"Background task");
  else if(frame.action==="tool_progress")activity(frame.note,"Pi activity");
  else if(frame.action==="tool_partial_result"){
    const data=frame.content?.data||{};
    if(data.event==="approval_required")activity(`${data.tool||"tool"}: ${data.summary||"protected action"}`,"Approval required");
    else activity(data.command?`bash: ${data.command}`:data.path?`${data.tool||"file"}: ${data.path}`:frame.content?.speak,"Pi activity");
  }
  else if(frame.action==="tool_result")activity(frame.content?.speak||`Task ${frame.outcome||"finished"}`,frame.verified?"Verified":"Pi reported");
  else if(frame.action==="tool_cancel")activity("Task cancelled","Cancelled");
}

async function flush(){
  if(flushing||!ready||!client)return;flushing=true;
  try{
    for(const [seq,frame]of [...seqs]){
      let accepted=true;
      if(frame.action==="tool_deferred")accepted=client.sendToolDeferred(frame.id,{handle:frame.handle,statusLabel:frame.status_label});
      else if(frame.action==="tool_progress")accepted=client.sendToolProgress(frame.id,frame.note);
      else if(frame.action==="tool_partial_result")accepted=client.sendToolPartialResult(frame.id,frame.content,{reply:!!frame.reply});
      else if(frame.action==="tool_result")accepted=client.sendToolResult(frame.id,frame.content,{outcome:frame.outcome,verified:!!frame.verified});
      else if(frame.action==="tool_cancel")accepted=client.sendToolCancel(frame.id);
      else if(frame.action==="voice_prompt")accepted=await deliverVoicePrompt(frame);
      else{seqs.delete(seq);continue}
      if(accepted!==true){ready=false;break}
      renderControl(frame);
      if(frame.action==="tool_deferred"){deferredIds.add(frame.id);status.textContent="working"}
      if(frame.action==="tool_result"&&deferredIds.delete(frame.id))status.textContent=deferredIds.size?"working":"idle";
      seqs.delete(seq);wireSend({type:"local",event:"bridge_ack",seq});
    }
  }catch(error){ready=false;notice.textContent=`Voice control delivery failed: ${error.message||error}`}
  finally{flushing=false}
  if(ready&&seqs.size)queueMicrotask(flush);
}

voice.onclick=async()=>{
  voice.disabled=true;notice.textContent="";
  try{
    const active=await openClient();
    if(mic){active.stopMic();mic=false;voice.textContent="Start voice"}
    else{await active.startMic({workletUrl:"./vendor/converse/mic-worklet.js"});mic=true;voice.textContent="Stop voice"}
    voice.setAttribute("aria-pressed",String(mic));
  }catch(error){notice.textContent=`Could not start voice: ${error.message||error}`}
  finally{voice.disabled=false}
};
</script>
</body>
</html>
