<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converse Code</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --text:#1c1e21; --muted:#6b7280;
    --border:#e2e4e8; --accent:#3b6fe0; --accent-fg:#ffffff;
    --danger:#d0403b; --you:#1c1e21; --asst:#245c3b; --inject:#8a5a00;
    --dot-connecting:#d9a400; --dot-open:#2e9e4f; --dot-closed:#c0392b;
    --chip-idle:#3b6fe0; --chip-working:#d9a400; --chip-menu:#7a4fd1;
    --meter-bg:#e6e8eb; --meter-fill:#3b6fe0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --panel:#1e2126; --text:#e7e9ec; --muted:#9aa1ab;
      --border:#2c3038; --accent:#5a8dff; --accent-fg:#0b0d10;
      --danger:#ef5f5a; --you:#e7e9ec; --asst:#6fd39a; --inject:#f0c15a;
      --dot-connecting:#e0b23a; --dot-open:#4bcf78; --dot-closed:#e0625c;
      --chip-idle:#5a8dff; --chip-working:#e0b23a; --chip-menu:#a988f0;
      --meter-bg:#2a2d33; --meter-fill:#5a8dff;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:.6rem;
    padding:.75rem 1rem; border-bottom:1px solid var(--border);
    background:var(--panel); flex:0 0 auto;
  }
  header h1{font-size:1.05rem; margin:0; font-weight:650; letter-spacing:.01em;}
  .dot{width:.6rem; height:.6rem; border-radius:50%; flex:0 0 auto; background:var(--dot-closed); transition:background .2s;}
  .dot.connecting{background:var(--dot-connecting);}
  .dot.open{background:var(--dot-open);}
  .dot.closed{background:var(--dot-closed);}
  .spacer{flex:1;}
  .chip{
    font-size:.75rem; padding:.25rem .6rem; border-radius:999px;
    background:var(--chip-idle); color:#fff; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  }
  .chip.working{background:var(--chip-working); color:#1c1e21;}
  .chip.menu{background:var(--chip-menu);}
  .chip.idle{background:var(--chip-idle);}
  main{
    flex:1 1 auto; overflow:hidden; display:flex; flex-direction:column;
    max-width:760px; width:100%; margin:0 auto; padding:0 1rem;
  }
  #log{
    flex:1 1 auto; overflow-y:auto; padding:1rem 0; display:flex; flex-direction:column; gap:.5rem;
  }
  .entry{max-width:88%; padding:.5rem .75rem; border-radius:.6rem; line-height:1.4; font-size:.92rem; word-wrap:break-word;}
  .entry.you{align-self:flex-end; background:var(--accent); color:var(--accent-fg);}
  .entry.assistant{align-self:flex-start; background:var(--panel); border:1px solid var(--border); color:var(--asst);}
  .entry.inject{
    align-self:center; background:transparent; border:1px dashed var(--border);
    color:var(--inject); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem;
  }
  .entry.banner{align-self:center; background:transparent; color:var(--muted); font-size:.8rem; font-style:italic;}
  .entry .label{display:block; font-size:.68rem; opacity:.65; margin-bottom:.15rem; text-transform:uppercase; letter-spacing:.04em;}
  footer{
    flex:0 0 auto; padding:1rem; border-top:1px solid var(--border); background:var(--panel);
    display:flex; align-items:center; gap:1rem; max-width:760px; width:100%; margin:0 auto;
  }
  #micBtn{
    flex:0 0 auto; width:3.4rem; height:3.4rem; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-fg); font-size:1.4rem; display:flex; align-items:center; justify-content:center;
    transition:transform .1s, background .2s; box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  #micBtn:active{transform:scale(.94);}
  #micBtn.live{background:var(--danger);}
  #meterWrap{flex:1 1 auto; height:.5rem; border-radius:999px; background:var(--meter-bg); overflow:hidden;}
  #meterFill{height:100%; width:0%; background:var(--meter-fill); transition:width .06s linear;}
  #micLabel{font-size:.78rem; color:var(--muted); flex:0 0 auto; min-width:3.2rem; text-align:right;}
</style>
</head>
<body>
<header>
  <span class="dot closed" id="wsDot" title="WebSocket status"></span>
  <h1>Converse Code</h1>
  <div class="spacer"></div>
  <span class="chip idle" id="statusChip">idle</span>
</header>
<main>
  <div id="log"></div>
</main>
<footer>
  <button id="micBtn" title="Toggle microphone">&#127908;</button>
  <div id="meterWrap"><div id="meterFill"></div></div>
  <span id="micLabel">off</span>
</footer>
<script>
(function(){
  "use strict";

  // ---------- WebSocket connection with auto-reconnect ----------
  var ws = null;
  var wsDot = document.getElementById("wsDot");
  var statusChip = document.getElementById("statusChip");
  var reconnectDelay = 2000;
  var reconnectTimer = null;

  function wsUrl(){
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    // The run's token arrives in this page's own URL; the server requires it
    // on the socket too, so other pages can't open one.
    var token = new URLSearchParams(location.search).get("t") || "";
    return proto + "//" + location.host + "/ws?t=" + encodeURIComponent(token);
  }

  function setDot(state){
    wsDot.className = "dot " + state;
  }

  function connect(){
    setDot("connecting");
    try{
      ws = new WebSocket(wsUrl());
    }catch(e){
      scheduleReconnect();
      return;
    }
    ws.binaryType = "arraybuffer";
    ws.onopen = function(){
      setDot("open");
    };
    ws.onclose = function(){
      setDot("closed");
      scheduleReconnect();
    };
    ws.onerror = function(){
      try{ ws.close(); }catch(e){}
    };
    ws.onmessage = function(ev){
      if(typeof ev.data === "string"){
        handleJson(ev.data);
      } else {
        handleAudioFrame(ev.data);
      }
    };
  }

  function scheduleReconnect(){
    if(reconnectTimer) return;
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      connect();
    }, reconnectDelay);
  }

  function sendJson(obj){
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify(obj));
    }
  }

  // ---------- Conversation log ----------
  var logEl = document.getElementById("log");
  var userScrolledUp = false;

  logEl.addEventListener("scroll", function(){
    var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 24;
    userScrolledUp = !atBottom;
  });

  function autoScroll(){
    if(!userScrolledUp){
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  var currentYouEl = null;
  var currentAssistantEl = null;
  var assistantText = "";  // accumulates text_delta chunks for the live caption

  function makeEntry(kind, labelText){
    var div = document.createElement("div");
    div.className = "entry " + kind;
    if(labelText){
      var label = document.createElement("span");
      label.className = "label";
      label.textContent = labelText;
      div.appendChild(label);
    }
    var body = document.createElement("span");
    body.className = "body";
    div.appendChild(body);
    logEl.appendChild(div);
    autoScroll();
    return div;
  }

  function setBody(entryEl, text){
    var body = entryEl.querySelector(".body");
    body.textContent = text;
    autoScroll();
  }

  function freezeYou(){
    currentYouEl = null;
  }
  function freezeAssistant(){
    currentAssistantEl = null;
  }

  function addInjected(text){
    var el = makeEntry("inject", "→ sent to Claude Code");
    setBody(el, text);
  }

  function addBanner(text){
    makeEntry("banner", null).querySelector(".body").textContent = text;
    autoScroll();
  }

  // ---------- Local + passthrough JSON handling ----------
  function pickText(msg){
    if(typeof msg.text === "string") return msg.text;
    if(typeof msg.transcript === "string") return msg.transcript;
    if(typeof msg.partial === "string") return msg.partial;
    if(typeof msg.utterance === "string") return msg.utterance;
    if(typeof msg.content === "string") return msg.content;
    return "";
  }

  function isFinal(msg){
    var f = msg.final !== undefined ? msg.final : msg.is_final;
    if(f === undefined) return false;
    return !!f;
  }

  function handleJson(raw){
    var msg;
    try{
      msg = JSON.parse(raw);
    }catch(e){
      console.debug("bad json frame", raw);
      return;
    }

    if(msg.type === "local"){
      if(msg.event === "status"){
        updateStatusChip(msg.state, msg.queue);
      } else if(msg.event === "injected"){
        addInjected(msg.text || "");
      }
      return;
    }

    switch(msg.type){
      case "asr": {
        var text = pickText(msg);
        if(!currentYouEl){
          currentYouEl = makeEntry("you", "You");
        }
        setBody(currentYouEl, text);
        if(isFinal(msg)){
          freezeYou();
        }
        break;
      }
      case "turn": {
        // Carries the full reply text already, but text_delta streams it word by
        // word — start empty and let the deltas fill in, so captions animate.
        freezeYou();
        currentAssistantEl = makeEntry("assistant", "Assistant");
        assistantText = "";
        break;
      }
      case "text_delta": {
        if(!currentAssistantEl){
          currentAssistantEl = makeEntry("assistant", "Assistant");
          assistantText = "";
        }
        assistantText += (msg.delta || "");
        setBody(currentAssistantEl, assistantText);
        break;
      }
      case "utterance": {
        // Authoritative final text — replaces whatever the deltas assembled.
        var atext = pickText(msg);
        if(!currentAssistantEl){
          currentAssistantEl = makeEntry("assistant", "Assistant");
        }
        assistantText = atext;
        setBody(currentAssistantEl, atext);
        break;
      }
      case "done": {
        freezeAssistant();
        freezeYou();
        break;
      }
      case "interrupted": {
        handleInterrupted(msg);
        break;
      }
      case "bye": {
        addBanner("Session ended" + (msg.reason ? (": " + msg.reason) : ""));
        break;
      }
      default:
        console.debug("ignored message type", msg.type, msg);
    }
  }

  function updateStatusChip(state, queue){
    state = state || "idle";
    statusChip.className = "chip " + state;
    var label = state;
    if(Array.isArray(queue) && queue.length > 0){
      label += " (" + queue.length + ")";
    }
    statusChip.textContent = label;
  }

  // ---------- Playback (Web Audio API) ----------
  // TTS arrives as PCM16 little-endian, mono, 16 kHz — same encoding as the mic
  // uplink. (Reinterpreting those bytes as Float32 is not "slightly wrong", it
  // is pure noise: the exponent bits become the waveform.)
  // Two more things matter for clean audio:
  //  1. A jitter buffer. Scheduling each chunk to start "now" means any network
  //     jitter is an audible gap; lead the playhead by JITTER_LEAD and re-lead
  //     after an underrun.
  //  2. Resample into the *device's* native rate ourselves, carrying the last
  //     input sample across chunk boundaries. Forcing a 16 kHz AudioContext (or
  //     interpolating each chunk from zero) leaves a discontinuity — a click —
  //     at every chunk edge.
  var STREAM_RATE = 16000;
  var JITTER_LEAD = 0.1;     // seconds of buffer before the first chunk plays
  var SCHEDULE_AHEAD = 0.2;  // don't schedule further ahead than this
  var CLEAR_FADE = 0.02;     // fade out on barge instead of a hard cut

  var playCtx = null;
  var playGain = null;
  var scheduledSources = [];
  var playQueue = [];        // Float32Array chunks, already at context rate
  var nextPlayTime = 0;
  var resampleRatio = 1;
  var resampleCarry = 0;
  var playTimer = null;

  function getPlayCtx(){
    if(!playCtx){
      playCtx = new (window.AudioContext || window.webkitAudioContext)();
      playGain = playCtx.createGain();
      playGain.connect(playCtx.destination);
      resampleRatio = playCtx.sampleRate / STREAM_RATE;
      nextPlayTime = playCtx.currentTime;
    }
    if(playCtx.state === "suspended") playCtx.resume();
    return playCtx;
  }

  function resampleToCtxRate(input){
    if(resampleRatio === 1) return Float32Array.from(input);
    var outLen = Math.floor(input.length * resampleRatio);
    var out = new Float32Array(outLen);
    var step = 1 / resampleRatio;
    for(var i = 0; i < outLen; i++){
      var pos = i * step;
      var idx = Math.floor(pos);
      var frac = pos - idx;
      var prev = idx === 0 ? resampleCarry : input[idx - 1];
      var cur = input[idx] !== undefined ? input[idx] : prev;
      out[i] = prev + (cur - prev) * frac;
    }
    resampleCarry = input[input.length - 1];
    return out;
  }

  function pcm16ToFloat32(arrayBuffer){
    var pcm = new Int16Array(arrayBuffer.byteLength - (arrayBuffer.byteLength % 2)
      ? arrayBuffer.slice(0, arrayBuffer.byteLength - (arrayBuffer.byteLength % 2))
      : arrayBuffer);
    var out = new Float32Array(pcm.length);
    for(var i=0;i<pcm.length;i++){
      out[i] = pcm[i] / (pcm[i] < 0 ? 32768 : 32767);
    }
    return out;
  }

  function handleAudioFrame(arrayBuffer){
    if(arrayBuffer.byteLength < 2) return;
    var floatData = pcm16ToFloat32(arrayBuffer);
    if(floatData.length === 0) return;
    getPlayCtx();
    playQueue.push(resampleToCtxRate(floatData));
    schedulePlayback();
    if(!playTimer) playTimer = setInterval(schedulePlayback, 25);
  }

  function schedulePlayback(){
    if(!playCtx) return;
    var now = playCtx.currentTime;
    if(playQueue.length === 0){
      if(nextPlayTime <= now && playTimer){ clearInterval(playTimer); playTimer = null; }
      return;
    }
    playGain.gain.cancelScheduledValues(now);
    playGain.gain.setValueAtTime(1, now);
    // Underrun (or first chunk): re-establish the jitter lead.
    if(nextPlayTime <= now) nextPlayTime = now + JITTER_LEAD;
    while(playQueue.length && nextPlayTime < now + SCHEDULE_AHEAD){
      var data = playQueue.shift();
      var buffer = playCtx.createBuffer(1, data.length, playCtx.sampleRate);
      buffer.copyToChannel(data, 0);
      var src = playCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(playGain);
      var startAt = Math.max(now, nextPlayTime);
      src.start(startAt);
      nextPlayTime = startAt + buffer.duration;
      scheduledSources.push(src);
      src.onended = function(){
        var idx = scheduledSources.indexOf(this);
        if(idx >= 0) scheduledSources.splice(idx, 1);
      }.bind(src);
    }
  }

  function pendingPlaybackMs(){
    if(!playCtx) return 0;
    var scheduled = Math.max(0, nextPlayTime - playCtx.currentTime);
    var queued = playQueue.reduce(function(s, c){ return s + c.length; }, 0) / playCtx.sampleRate;
    return (scheduled + queued) * 1000;
  }

  function handleInterrupted(msg){
    var ctx = playCtx;
    var remainingMs = 0;
    if(ctx){
      remainingMs = pendingPlaybackMs();
      // Short fade so the cut isn't itself a click, then drop everything.
      var now = ctx.currentTime;
      playGain.gain.cancelScheduledValues(now);
      playGain.gain.setValueAtTime(playGain.gain.value, now);
      playGain.gain.linearRampToValueAtTime(0, now + CLEAR_FADE);
      scheduledSources.forEach(function(src){
        try{ src.onended = null; src.stop(now + CLEAR_FADE); }catch(e){}
      });
      scheduledSources = [];
      playQueue = [];
      nextPlayTime = ctx.currentTime;
      resampleCarry = 0;
    }
    var ms = Math.round(remainingMs);
    var bargeSeq = (msg && msg.barge_seq !== undefined) ? msg.barge_seq : 0;
    sendJson({
      type: "playback_stopped",
      remaining_ms: ms,
      discarded_ms: ms,
      barge_seq: bargeSeq
    });
    freezeAssistant();
  }

  // ---------- Microphone capture ----------
  var micBtn = document.getElementById("micBtn");
  var micLabel = document.getElementById("micLabel");
  var meterFill = document.getElementById("meterFill");

  var micActive = false;
  var micCtx = null;
  var micStream = null;
  var micSource = null;
  var micWorkletNode = null;
  var workletBlobUrl = null;

  var WORKLET_SRC = [
    "class MicCaptureProcessor extends AudioWorkletProcessor {",
    "  constructor(options){",
    "    super();",
    "    this.targetRate = 16000;",
    "    this.inRate = sampleRate;",
    "    this.ratio = this.inRate / this.targetRate;",
    "    this.frameSize = 640;",
    "    this.outBuf = new Float32Array(0);",
    "    this.pos = 0;",
    "    this.inBuf = new Float32Array(0);",
    "    this.cursor = 0;",
    "  }",
    // Resamples with a cursor that persists across process() blocks: restarting
    // per block would put a discontinuity (click) at every 128-sample boundary
    // and discard the fractional remainder, drifting the sample rate.
    "  appendResampled(input){",
    "    var buf = new Float32Array(this.inBuf.length + input.length);",
    "    buf.set(this.inBuf);",
    "    buf.set(input, this.inBuf.length);",
    "    var out = [];",
    "    while(this.cursor + 1 < buf.length){",
    "      var i0 = Math.floor(this.cursor);",
    "      var frac = this.cursor - i0;",
    "      out.push(buf[i0]*(1-frac) + buf[i0+1]*frac);",
    "      this.cursor += this.ratio;",
    "    }",
    "    var consumed = Math.floor(this.cursor);",
    "    this.inBuf = buf.slice(consumed);",
    "    this.cursor -= consumed;",
    "    var resampled = Float32Array.from(out);",
    "    var merged = new Float32Array(this.outBuf.length - this.pos + resampled.length);",
    "    merged.set(this.outBuf.subarray(this.pos));",
    "    merged.set(resampled, this.outBuf.length - this.pos);",
    "    this.outBuf = merged;",
    "    this.pos = 0;",
    "  }",
    "  process(inputs){",
    "    var input = inputs[0];",
    "    if(!input || input.length === 0) return true;",
    "    var channelData = input[0];",
    "    if(!channelData || channelData.length === 0) return true;",
    "    var mono = channelData;",
    "    if(input.length > 1){",
    "      mono = new Float32Array(channelData.length);",
    "      for(var c=0;c<input.length;c++){",
    "        var ch = input[c];",
    "        for(var i=0;i<ch.length;i++){ mono[i] += ch[i] / input.length; }",
    "      }",
    "    }",
    "    this.appendResampled(mono);",
    "    var level = 0;",
    "    for(var k=0;k<mono.length;k++){ level = Math.max(level, Math.abs(mono[k])); }",
    "    while(this.outBuf.length - this.pos >= this.frameSize){",
    "      var frame = this.outBuf.subarray(this.pos, this.pos + this.frameSize);",
    "      var int16 = new Int16Array(this.frameSize);",
    "      for(var j=0;j<this.frameSize;j++){",
    "        var s = Math.max(-1, Math.min(1, frame[j]));",
    "        int16[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;",
    "      }",
    "      this.port.postMessage({ pcm: int16.buffer, level: level }, [int16.buffer]);",
    "      this.pos += this.frameSize;",
    "    }",
    "    if(this.pos > 0 && this.pos === this.outBuf.length){",
    "      this.outBuf = new Float32Array(0);",
    "      this.pos = 0;",
    "    }",
    "    return true;",
    "  }",
    "}",
    "registerProcessor('mic-capture-processor', MicCaptureProcessor);"
  ].join("\n");

  function setMeter(level){
    var pct = Math.min(100, Math.round(level * 100));
    meterFill.style.width = pct + "%";
  }

  function startMic(){
    if(micActive) return;
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}, video:false})
      .then(function(stream){
        micStream = stream;
        micCtx = new (window.AudioContext || window.webkitAudioContext)();
        var blob = new Blob([WORKLET_SRC], {type:"application/javascript"});
        workletBlobUrl = URL.createObjectURL(blob);
        return micCtx.audioWorklet.addModule(workletBlobUrl).then(function(){
          micSource = micCtx.createMediaStreamSource(micStream);
          micWorkletNode = new AudioWorkletNode(micCtx, "mic-capture-processor");
          micWorkletNode.port.onmessage = function(ev){
            var data = ev.data;
            if(ws && ws.readyState === WebSocket.OPEN){
              ws.send(data.pcm);
            }
            setMeter(data.level || 0);
          };
          micSource.connect(micWorkletNode);
          micActive = true;
          micBtn.classList.add("live");
          micLabel.textContent = "live";
        });
      })
      .catch(function(err){
        console.debug("mic error", err);
        addBanner("Microphone permission denied or unavailable.");
      });
  }

  function stopMic(){
    if(!micActive) return;
    micActive = false;
    micBtn.classList.remove("live");
    micLabel.textContent = "off";
    setMeter(0);
    try{ if(micWorkletNode) micWorkletNode.port.onmessage = null; }catch(e){}
    try{ if(micSource) micSource.disconnect(); }catch(e){}
    try{ if(micWorkletNode) micWorkletNode.disconnect(); }catch(e){}
    try{ if(micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ if(micCtx) micCtx.close(); }catch(e){}
    if(workletBlobUrl){ URL.revokeObjectURL(workletBlobUrl); workletBlobUrl = null; }
    micCtx = null; micStream = null; micSource = null; micWorkletNode = null;
  }

  micBtn.addEventListener("click", function(){
    if(micActive){ stopMic(); } else { startMic(); }
  });

  // ---------- Boot ----------
  connect();
})();
</script>
</body>
</html>
