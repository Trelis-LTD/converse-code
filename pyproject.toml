[project]
name = "converse-code"
version = "0.1.1"
description = "Talk to Claude Code by voice via Converse"
readme = "PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "aiohttp>=3.9",
    "pyte>=0.8.2",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Trelis-LTD/converse-code"
Repository = "https://github.com/Trelis-LTD/converse-code"
Documentation = "https://github.com/Trelis-LTD/converse-code#readme"

[project.scripts]
converse-code = "converse_code.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converse_code"]
